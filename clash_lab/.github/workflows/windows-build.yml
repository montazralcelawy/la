name: Windows build

on:
  push:
    branches: ["main", "rebuild/uiautomator2-core"]
    paths:
      - "clash_lab/**"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clash_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clash_lab/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller
      - name: Test database initialization
        run: pytest -q
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --windowed --name ClashAutomationLab --collect-all uiautomator2 --collect-all adbutils main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ClashAutomationLab-windows
          path: clash_lab/dist/ClashAutomationLab/
          if-no-files-found: error
