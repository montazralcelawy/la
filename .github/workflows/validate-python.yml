name: Validate and package Windows app

on:
  push:
    paths:
      - "clash_automation_lab_v2/**"
      - ".github/workflows/validate-python.yml"
  pull_request:
    paths:
      - "clash_automation_lab_v2/**"
      - ".github/workflows/validate-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clash_automation_lab_v2
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clash_automation_lab_v2/requirements.txt

      - name: Install app and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run automated task-engine tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name ClashAutomationLab main.py

      - name: Prepare portable ZIP
        shell: pwsh
        run: |
          Copy-Item README.md dist/ClashAutomationLab/README.md
          Copy-Item strategy_config.example.json dist/ClashAutomationLab/strategy_config.example.json
          @(
            '@echo off',
            'cd /d "%~dp0"',
            'start "" "ClashAutomationLab.exe"'
          ) | Set-Content -Encoding ascii dist/ClashAutomationLab/تشغيل-البرنامج.bat
          Compress-Archive -Path dist/ClashAutomationLab -DestinationPath dist/ClashAutomationLab-Windows.zip -Force

      - name: Upload downloadable Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ClashAutomationLab-Windows
          path: clash_automation_lab_v2/dist/ClashAutomationLab-Windows.zip
          if-no-files-found: error
          retention-days: 30
